---
#FIXME This ends the whole playbook.
- name: Ignore dev sites
  meta: end_host
  when: env == 'Dev'

- name: Configure cron check for check_git
  cron:
    hour: "*/4"
    minute: "{{ site_number|int % 60 }}"
    name: "check_git for {{bare_url}}"
    job: "/usr/lib/nagios/plugins/check_git -s -d {{ gitroot }} -n {{ bare_url }} -l /var/log/git/{{ bare_url }}.log"
  become_user: "{{ run_as_user }}"

- name: Create /var/log/git
  file:
    path: /var/log/git
    state: directory
    mode: '0755'

- name: Create an empty log file with correct ownership
  file:
    path: "/var/log/git/{{ bare_url }}.log"
    state: touch
    mode: 0644
    owner: "{{ run_as_user }}"
    group: "{{ run_as_user }}"

- name: wp-cron
  cron:
    minute: "{{ site_number|int % 60 }},{{ (site_number|int % 60) + 15 }},{{ (site_number|int % 60) + 30 }},{{ (site_number|int % 60) + 45 }}"
    name: "WP Cron {{bare_url}}"
    job: "{{ wp_cli_path | default('/usr/local/bin/wp') }} cron event run --due-now  --path={{ webroot }} --quiet"
  become_user: "{{ run_as_user }}"
  when: cms == 'WordPress'
